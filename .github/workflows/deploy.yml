name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "walksnail"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: OpenTxLogAnalizer/otx-ui/package-lock.json

      - name: install dependencies
        working-directory: OpenTxLogAnalizer/otx-ui
        run: npm ci

      - name: build webapp
        working-directory: OpenTxLogAnalizer/otx-ui
        # adjust build command if base-href is configured differently in package.json
        run: npm run build -- --base-href /OpenTxLogAnalizer/

      - name: upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: OpenTxLogAnalizer/OpenTxLogAnalizer/www

      - name: deploy to github pages
        id: deployment
        uses: actions/deploy-pages@v4